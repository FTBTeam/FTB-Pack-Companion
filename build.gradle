plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = "${mod_version}"
    group = rootProject.maven_group

    apply from: "https://raw.githubusercontent.com/FTBTeam/mods-meta/main/gradle/publishing.gradle"

    repositories {
        maven {
            url "https://maven.ftb.dev/releases"
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }
}

publishMods {
    def CFToken = providers.environmentVariable("CURSEFORGE_KEY")

    dryRun = !CFToken.isPresent()
    changelog = providers.environmentVariable("CHANGELOG").orElse("No changelog provided")
    version = project.version
    type = ftbPublishing.relType == "alpha" ? ALPHA : (ftbPublishing.relType == "beta" ? BETA : STABLE)

    def createOptions = (String projectName) -> {
        publishOptions {
            file = project.provider { project(":$projectName").tasks.remapJar }.flatMap { it.archiveFile }
            displayName = "${mod_name} ${projectName.capitalize()} ${project.version}"
            modLoaders.add(projectName)
        }
    }

    def fabricOptions = createOptions("fabric")
    def forgeOptions = createOptions("forge")

    def curseForgeOptions = curseforgeOptions {
        accessToken = CFToken.orElse("missing")
        projectId = curseforge_id
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = true
        server = true
    }

    curseforge("curseforgeFabric") {
        from(curseForgeOptions, fabricOptions)
        requires("ftb-library-fabric")
    }

    curseforge("curseforgeForge") {
        from(curseForgeOptions, forgeOptions)
        requires("ftb-library-forge")
    }
}
